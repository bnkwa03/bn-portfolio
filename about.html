<body>
  <header class="nav">
    <a href="index.html" class="nav__mark">BN</a>
    <p class="nav__title">Mixed-Methods UX Researcher</p>
    <nav class="nav__links">
      <a href="index.html#work">Work</a>
      <a href="play.html">Play</a>

    </nav>
  </header>

  <main>
    <!-- =========================================================
         ABOUT — interactive node map (see about-map.js for content)
         ========================================================= -->
    <section class="about-board">
      <p class="about-board__hint">Drag to pan · scroll to zoom · click a circle to open it.</p>
      <!-- Desktop: pannable / zoomable canvas. JS renders nodes into #about-world. -->
      <div class="about-map" id="about-map" aria-label="About Bennie — interactive map">
        <div class="about-world" id="about-world"></div>
        <div class="about-zoom" aria-label="Zoom controls">
          <button type="button" class="about-zoom__btn" data-zoom="in" aria-label="Zoom in">+</button>
          <button type="button" class="about-zoom__btn" data-zoom="out" aria-label="Zoom out">&minus;</button>
          <button type="button" class="about-zoom__btn" data-zoom="reset" aria-label="Reset view">⤢</button>
        </div>
      </div>
      <!-- Mobile / no-JS-canvas fallback: JS renders a stacked accordion here. -->
      <div class="about-stack" id="about-stack"></div>
    </section>

    <!-- Detail card shown when a leaf bubble is clicked -->
    <div class="about-card" id="about-card" role="dialog" aria-modal="true" hidden>
      <div class="about-card__panel">
        <button type="button" class="about-card__close" aria-label="Close">&times;</button>
        <h2 class="about-card__title"></h2>
        <p class="about-card__body"></p>
        <a class="about-card__link" href="#" hidden>See more &rarr;</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p class="footer__credit">Designed + built by Bennie</p>
    <div class="footer__links">
      <a href="https://www.linkedin.com/in/bennie-nkwantabisa" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:bnkwa03@stanford.edu">Email</a>
    </div>
  </footer>

  <div class="cursor" aria-hidden="true">
    <span class="cursor__eye">
      <span class="cursor__iris"><span class="cursor__pupil"></span></span>
      <span class="cursor__glint"></span>
    </span>
    <span class="cursor__label">Read more</span>
  </div>

  <script src="script.js"></script>
  <script src="about-map.js"></script>
</body>
</html>
